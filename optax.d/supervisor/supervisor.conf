[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
user=root
priority=1

[program:OapiConsume_prod]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/env /usr/local/bin/php -d opcache.enable=0 /var/www/optax/index.php oapi consumeData
autostart=true
autorestart=true
numprocs=1
user=root
directory=/var/www/optax
stderr_logfile=/tmp/supervisor.err.log
stdout_logfile=/tmp/supervisor.out.log
priority=2

[program:OapiConsumeSingle_prod]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/env /usr/local/bin/php -d opcache.enable=0 /var/www/optax/index.php oapi singleConsumeData
autostart=true
autorestart=true
numprocs=1
user=root
directory=/var/www/optax
stderr_logfile=/tmp/supervisor.err.log
stdout_logfile=/tmp/supervisor.out.log
priority=2

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stderr_logfile=/tmp/supervisor.err.log
stdout_logfile=/tmp/supervisor.out.log
priority=2